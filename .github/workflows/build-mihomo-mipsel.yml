# SPDX-License-Identifier: MIT
name: Build Mihomo for MIPSel

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mihomo-mipsel-release
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest Mihomo release
        id: check
        run: |
          set -euo pipefail
          LATEST=$(curl -fsSL --retry 3 https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -er '.tag_name')
          [[ "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Inspect release and verify checksum bytes
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.latest }}
        run: python3 scripts/release_assets.py plan "mipsel-$VERSION" "mihomo-linux-mipsel-softfloat-v${VERSION#v}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Install dependencies
        if: steps.check-release.outputs.mode == 'build'
        run: |
          echo "=== Installing dependencies ==="
          sudo apt-get update
          sudo apt-get install -y gcc-mipsel-linux-gnu

      - name: Clone and build Mihomo
        if: steps.check-release.outputs.mode == 'build'
        env:
          VERSION: ${{ steps.check.outputs.latest }}
        run: |
          echo "=== Cloning Mihomo $VERSION ==="
          git clone --depth 1 --branch "$VERSION" https://github.com/MetaCubeX/mihomo.git ./mihomo-src
          cd ./mihomo-src

          # Licensing safeguard: go-lzo@96a758eda86e is GPLv2 and is
          # imported into the v1.19.32 MIPSel package graph. A future
          # upstream release must not silently distribute another combined
          # GPLv3/GPLv2 artifact until the grant/linkage issue is resolved.
          # Scope strictly to NEW builds; never mutate existing releases.
          echo "=== GPLv2-only MIPSel package inclusion safety gate ==="
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
            go list -deps -f '{{if .Module}}{{.Module.Path}}{{end}}' . \
            > ../mipsel-selected-package-modules.txt
          test -s ../mipsel-selected-package-modules.txt
          if grep -Fxq 'github.com/rasky/go-lzo' ../mipsel-selected-package-modules.txt; then
            echo "::error::Potential GPLv2/GPLv3 incompatibility: go-lzo in MIPSel package graph; see Issue #8. New binary publication blocked pending review."
            exit 2
          fi

          echo "=== Building optimized binary for MIPSel (MT7621) ==="
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
          go build \
          -trimpath \
          -ldflags "-s -w -buildid= \
          -X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' \
          -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
          -o ../mihomo-linux-mipsel-softfloat

          echo "=== Build completed ==="
          ls -la ../mihomo-linux-mipsel-softfloat
          file ../mihomo-linux-mipsel-softfloat

      - name: Create release assets
        if: steps.check-release.outputs.mode == 'build'
        id: package
        env:
          VERSION: ${{ steps.check.outputs.latest }}
        run: |
          VER_CLEAN="${VERSION#v}"
          cp ./mihomo-linux-mipsel-softfloat ./mihomo-linux-mipsel-softfloat-v${VER_CLEAN}
          echo "bin_name=mihomo-linux-mipsel-softfloat-v${VER_CLEAN}" >> "$GITHUB_OUTPUT"
          sha256sum "mihomo-linux-mipsel-softfloat-v${VER_CLEAN}" > "mihomo-linux-mipsel-softfloat-v${VER_CLEAN}.sha256"
          sha256sum --check "mihomo-linux-mipsel-softfloat-v${VER_CLEAN}.sha256"
          ls -la ./mihomo-linux-mipsel-softfloat-v${VER_CLEAN}*

      # Third-party notices are generated BEFORE any release mutation, so an
      # unresolvable license aborts the job without publishing an incomplete
      # release. For build mode the freshly built binary carries the build
      # info; otherwise the already published release binary is downloaded.
      - name: Generate third-party notices for this version
        id: notices
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.latest }}
          RELEASE_MODE: ${{ steps.check-release.outputs.mode }}
        run: |
          set -euo pipefail
          VER_CLEAN="${VERSION#v}"
          BIN="mihomo-linux-mipsel-softfloat-v${VER_CLEAN}"
          if [[ "$RELEASE_MODE" != "build" ]]; then
            rm -rf ./published
            gh release download "mipsel-$VERSION" -R "$GITHUB_REPOSITORY" -p "$BIN" -O "./$BIN"
          fi
          python3 scripts/collect_upstream_licenses.py \
            --binary "./$BIN" \
            --summary "THIRD_PARTY_LICENSES-v${VER_CLEAN}.txt" \
            --full "THIRD_PARTY_NOTICES-v${VER_CLEAN}.txt" \
            --report "license-report-v${VER_CLEAN}.json"

      - name: Store generated notices as workflow artifacts
        if: always() && steps.notices.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: license-collection-failure
          path: |
            license-report-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish only missing or invalid assets
        if: steps.check-release.outputs.mode != 'complete'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.check-release.outputs.tag_name }}
          BIN_NAME: ${{ steps.check-release.outputs.bin_name }}
        run: python3 scripts/release_assets.py publish "$TAG_NAME" "$BIN_NAME"

      - name: Verify and publish exact tagged upstream GPL-3.0 LICENSE
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          VER_CLEAN="${VERSION#v}"
          python3 scripts/release_license.py "mipsel-$VERSION" "mihomo-linux-mipsel-softfloat-v${VER_CLEAN}"

      - name: Verify and publish third-party notice assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          VER_CLEAN="${VERSION#v}"
          python3 scripts/release_notices.py publish "mipsel-$VERSION" \
            "THIRD_PARTY_LICENSES-v${VER_CLEAN}.txt" "THIRD_PARTY_NOTICES-v${VER_CLEAN}.txt"
