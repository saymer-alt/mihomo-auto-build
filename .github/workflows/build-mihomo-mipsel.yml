name: Build Mihomo for MIPSel

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mihomo-mipsel-release
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest Mihomo release
        id: check
        run: |
          set -euo pipefail
          LATEST=$(curl -fsSL --retry 3 https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -er '.tag_name')
          [[ "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Inspect release and verify checksum bytes
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.latest }}
        run: python3 scripts/release_assets.py plan "mipsel-$VERSION" "mihomo-linux-mipsel-softfloat-v${VERSION#v}"

      - name: Setup Go
        if: steps.check-release.outputs.mode == 'build'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Install dependencies
        if: steps.check-release.outputs.mode == 'build'
        run: |
          echo "=== Installing dependencies ==="
          sudo apt-get update
          sudo apt-get install -y gcc-mipsel-linux-gnu

      - name: Clone and build Mihomo
        if: steps.check-release.outputs.mode == 'build'
        env:
          VERSION: ${{ steps.check.outputs.latest }}
        run: |
          echo "=== Cloning Mihomo $VERSION ==="
          git clone --depth 1 --branch "$VERSION" https://github.com/MetaCubeX/mihomo.git ./mihomo-src
          cd ./mihomo-src
          
          echo "=== Building optimized binary for MIPSel (MT7621) ==="
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
          go build \
          -trimpath \
          -ldflags "-s -w -buildid= \
          -X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' \
          -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
          -o ../mihomo-linux-mipsel-softfloat
          
          echo "=== Build completed ==="
          ls -la ../mihomo-linux-mipsel-softfloat
          file ../mihomo-linux-mipsel-softfloat

      - name: Create release assets
        if: steps.check-release.outputs.mode == 'build'
        id: package
        env:
          VERSION: ${{ steps.check.outputs.latest }}
        run: |
          VER_CLEAN="${VERSION#v}"
          cp ./mihomo-linux-mipsel-softfloat ./mihomo-linux-mipsel-softfloat-v${VER_CLEAN}
          echo "bin_name=mihomo-linux-mipsel-softfloat-v${VER_CLEAN}" >> "$GITHUB_OUTPUT"
          sha256sum "mihomo-linux-mipsel-softfloat-v${VER_CLEAN}" > "mihomo-linux-mipsel-softfloat-v${VER_CLEAN}.sha256"
          sha256sum --check "mihomo-linux-mipsel-softfloat-v${VER_CLEAN}.sha256"
          ls -la ./mihomo-linux-mipsel-softfloat-v${VER_CLEAN}*

      - name: Publish only missing or invalid assets
        if: steps.check-release.outputs.mode != 'complete'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.check-release.outputs.tag_name }}
          BIN_NAME: ${{ steps.check-release.outputs.bin_name }}
        run: python3 scripts/release_assets.py publish "$TAG_NAME" "$BIN_NAME"
