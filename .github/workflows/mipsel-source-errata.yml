# SPDX-License-Identifier: MIT
name: MIPSel source links and GPLv2 license errata (retired)

# RETIRED 2026-10-11: no automatic or manual publication.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mihomo-mipsel-release
  cancel-in-progress: false

jobs:
  release-descriptions:
    # Do not touch historical Release descriptions again by automation.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify all nine releases (read-only preflight)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_release_source_notes.py --mode plan
      - name: Publish only appended source pointers and confirmed GPLv2 errata
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_release_source_notes.py --mode publish
